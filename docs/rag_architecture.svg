<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RAG Architecture Diagram</title>
<desc>End-to-end RAG pipeline for Amazon Product Query Assistant showing flow from user query through guardrails, hybrid retrieval, tools, LLM generation, and response</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- styles -->
<style>
  text { font-family: system-ui, sans-serif; }
  .th  { font-size: 14px; font-weight: 500; fill: #1a1a2e; }
  .ts  { font-size: 12px; font-weight: 400; fill: #555; }
  .arr { stroke: #888; stroke-width: 1.5; fill: none; }
  .leader { stroke: #aaa; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
  .gray-box   { fill: #f1efe8; stroke: #888780; }
  .coral-box  { fill: #faece7; stroke: #d85a30; }
  .purple-box { fill: #eeedfe; stroke: #7f77dd; }
  .blue-box   { fill: #e6f1fb; stroke: #378add; }
  .teal-box   { fill: #e1f5ee; stroke: #1d9e75; }
  .amber-box  { fill: #faeeda; stroke: #ba7517; }
  .red-box    { fill: #fcebeb; stroke: #e24b4a; }
  .green-box  { fill: #eaf3de; stroke: #639922; }
  .gray-text   { fill: #2c2c2a; }
  .coral-text  { fill: #993c1d; }
  .purple-text { fill: #3c3489; }
  .blue-text   { fill: #0c447c; }
  .teal-text   { fill: #085041; }
  .amber-text  { fill: #633806; }
  .red-text    { fill: #501313; }
  .green-text  { fill: #27500a; }
</style>

<!-- User Query -->
<rect x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5" class="gray-box"/>
<text class="th gray-text" x="340" y="42" text-anchor="middle" dominant-baseline="central">User query</text>

<!-- Arrow -->
<line x1="340" y1="64" x2="340" y2="94" class="arr" marker-end="url(#arrow)"/>

<!-- Input Guardrails -->
<rect x="200" y="94" width="280" height="56" rx="8" stroke-width="0.5" class="coral-box"/>
<text class="th coral-text" x="340" y="114" text-anchor="middle" dominant-baseline="central">Input guardrails</text>
<text class="ts coral-text" x="340" y="132" text-anchor="middle" dominant-baseline="central">Off-topic · harmful · gibberish</text>

<!-- Blocked path -->
<line x1="480" y1="122" x2="556" y2="122" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="558" y="100" width="100" height="44" rx="8" stroke-width="0.5" class="red-box"/>
<text class="th red-text" x="608" y="122" text-anchor="middle" dominant-baseline="central">Blocked</text>

<!-- Arrow -->
<line x1="340" y1="150" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>

<!-- Hybrid Retrieval container -->
<rect x="160" y="180" width="360" height="110" rx="12" stroke-width="0.5" class="purple-box"/>
<text class="th purple-text" x="340" y="202" text-anchor="middle" dominant-baseline="central">Hybrid retrieval</text>

<!-- BM25 box inside -->
<rect x="180" y="214" width="140" height="56" rx="8" stroke-width="0.5" class="blue-box"/>
<text class="th blue-text" x="250" y="234" text-anchor="middle" dominant-baseline="central">BM25</text>
<text class="ts blue-text" x="250" y="252" text-anchor="middle" dominant-baseline="central">Keyword search</text>

<!-- Semantic box inside -->
<rect x="360" y="214" width="140" height="56" rx="8" stroke-width="0.5" class="teal-box"/>
<text class="th teal-text" x="430" y="234" text-anchor="middle" dominant-baseline="central">Semantic search</text>
<text class="ts teal-text" x="430" y="252" text-anchor="middle" dominant-baseline="central">FAISS + embeddings</text>

<!-- RRF label -->
<text class="ts" x="340" y="275" text-anchor="middle" dominant-baseline="central" fill="#666">RRF fusion</text>

<!-- Arrow -->
<line x1="340" y1="290" x2="340" y2="320" class="arr" marker-end="url(#arrow)"/>

<!-- Tools -->
<rect x="200" y="320" width="280" height="56" rx="8" stroke-width="0.5" class="amber-box"/>
<text class="th amber-text" x="340" y="340" text-anchor="middle" dominant-baseline="central">Tool integration</text>
<text class="ts amber-text" x="340" y="358" text-anchor="middle" dominant-baseline="central">Price filter · rating filter</text>

<!-- Arrow -->
<line x1="340" y1="376" x2="340" y2="406" class="arr" marker-end="url(#arrow)"/>

<!-- RAG Pipeline -->
<rect x="180" y="406" width="320" height="56" rx="8" stroke-width="0.5" class="purple-box"/>
<text class="th purple-text" x="340" y="426" text-anchor="middle" dominant-baseline="central">RAG pipeline</text>
<text class="ts purple-text" x="340" y="444" text-anchor="middle" dominant-baseline="central">GPT-4o-mini + product context</text>

<!-- FAISS side label -->
<line x1="160" y1="240" x2="120" y2="240" class="leader"/>
<text class="ts" x="115" y="234" text-anchor="end" fill="#666">FAISS index</text>
<text class="ts" x="115" y="250" text-anchor="end" fill="#666">112K products</text>

<!-- Arrow -->
<line x1="340" y1="462" x2="340" y2="492" class="arr" marker-end="url(#arrow)"/>

<!-- Output Guardrails -->
<rect x="200" y="492" width="280" height="56" rx="8" stroke-width="0.5" class="coral-box"/>
<text class="th coral-text" x="340" y="512" text-anchor="middle" dominant-baseline="central">Output guardrails</text>
<text class="ts coral-text" x="340" y="530" text-anchor="middle" dominant-baseline="central">Medical claims · grounding check</text>

<!-- Arrow -->
<line x1="340" y1="548" x2="340" y2="578" class="arr" marker-end="url(#arrow)"/>

<!-- Streamlit App -->
<rect x="200" y="578" width="280" height="56" rx="8" stroke-width="0.5" class="teal-box"/>
<text class="th teal-text" x="340" y="598" text-anchor="middle" dominant-baseline="central">Streamlit app</text>
<text class="ts teal-text" x="340" y="616" text-anchor="middle" dominant-baseline="central">BM25 · Semantic · Hybrid · RAG</text>

<!-- Arrow -->
<line x1="340" y1="634" x2="340" y2="664" class="arr" marker-end="url(#arrow)"/>

<!-- User Response -->
<rect x="240" y="664" width="200" height="44" rx="8" stroke-width="0.5" class="green-box"/>
<text class="th green-text" x="340" y="686" text-anchor="middle" dominant-baseline="central">Answer to user</text>

</svg>
